<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Made From Brains — Legal</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #e8eefc;
      --muted: #9fb0d0;
      --accent: #38bdf8;
      --line: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2a4a, var(--bg));
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    .meta { color: var(--muted); margin-bottom: 1.5rem; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: color-mix(in srgb, var(--card) 88%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem 1.2rem;
      margin-bottom: .85rem;
    }
    a.card:hover { border-color: var(--accent); }
    a.card strong { color: var(--accent); display: block; margin-bottom: .25rem; }
    a.card span { color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Made From Brains — Legal</h1>
    <p class="meta">Public privacy policies for store listings.</p>

    <a class="card" href="./my-first-bricks.html">
      <strong>My First Bricks</strong>
      <span>Privacy policy · <code>studio.madefrombrains.myfirstbricks</code></span>
    </a>

    <a class="card" href="./privacy.html">
      <strong>My First Budget (MFB)</strong>
      <span>Privacy policy · <code>com.mfb.budget.app</code></span>
    </a>
  </main>
</body>
</html>
